name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Documentation tests inspect action manifests at their referenced tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build docs site
        working-directory: website
        run: |
          npm ci
          npm run build

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test repository provisioning
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check provisioning CLI
        run: nix run .#setup-github -- --help

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:nix

      - run: nix flake check --no-build --accept-flake-config
      - run: nix build --accept-flake-config
